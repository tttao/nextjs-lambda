AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Next.js Lambda Application

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Runtime: nodejs18.x

Resources:
  NextjsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: nextjs-lambda-app
      CodeUri: .next/standalone/
      Handler: server.handler
      Events:
        RootApi:
          Type: Api
          Properties:
            Path: /
            Method: ANY
        ProxyApi:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  NextjsApi:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
